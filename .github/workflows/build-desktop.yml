name: Build Desktop (.exe)

on:
  push:
    paths: ["desktop/**", ".github/workflows/build-desktop.yml"]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
        continue-on-error: true
      - run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name ConectorDesktop
          --hidden-import pystray._win32 --collect-submodules websockets
          --collect-submodules pynput main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ConectorDesktop-exe
          path: desktop/dist/ConectorDesktop.exe
